<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payments Verification — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#071226;--card:#0e1b2a;--muted:#98a6b3;--accent:#e2b45c;--success:#22c55e;--danger:#ef4444}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#e6eef6}
    .container{max-width:1100px;margin:28px auto;padding:20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ffd98a);display:flex;align-items:center;justify-content:center;color:#071226;font-weight:800}
    h1{font-size:18px;margin:0}
    .controls{display:flex;gap:10px;align-items:center}
    .input,.select{padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.04);background:transparent;color:var(--muted)}
    .card{background:var(--card);border-radius:12px;padding:16px;border:1px solid rgba(255,255,255,.03)}
    .filters{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    .payments{display:grid;gap:10px}
    .payment-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.02);background:linear-gradient(180deg,rgba(255,255,255,.01),transparent)}
    .p-left{display:flex;gap:12px;align-items:center}
    .p-meta{display:flex;flex-direction:column}
    .amount{font-weight:700;font-size:16px}
    .muted{color:var(--muted);font-size:13px}
    .badge{padding:6px 10px;border-radius:999px;font-weight:700}
    .badge-pending{background:rgba(245,158,11,.12);color:var(--accent)}
    .badge-approved{background:rgba(34,197,94,.12);color:var(--success)}
    .badge-rejected{background:rgba(239,68,68,.12);color:var(--danger)}
    .actions{display:flex;gap:8px}
    .btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.04);color:var(--muted)}
    .btn.primary{background:var(--accent);color:#071226}
    .btn.success{background:var(--success);color:#04260f}
    .btn.danger{background:var(--danger);color:#fff}
    .detail{display:none;margin-top:8px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.03)}
    .detail.open{display:block}
    .screenshot{max-width:360px;border-radius:8px;border:1px solid rgba(255,255,255,.03);display:block}
    .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;align-items:center;justify-content:center;padding:20px}
    .modal{background:var(--card);width:100%;max-width:900px;border-radius:12px;padding:18px;border:1px solid rgba(255,255,255,.03);max-height:90vh;overflow:auto}
    .grid2{display:grid;grid-template-columns:1fr 380px;gap:16px}
    .notes{width:100%;min-height:90px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.03);background:transparent;color:var(--muted)}
    .small{font-size:13px;color:var(--muted)}
    footer{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:900px){.grid2{grid-template-columns:1fr}.screenshot{max-width:100%}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">B</div>
        <div>
          <h1>Payments Verification — Admin</h1>
          <div class="small">Manual mobile-money and bank transfer verification dashboard</div>
        </div>
      </div>
      <div class="controls">
        <input id="search" class="input" placeholder="Search TX, phone, school...">
        <select id="status" class="select"><option value="">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
        <button id="refresh" class="btn ghost">Refresh</button>
        <button id="useBackend" class="btn primary">Connect Backend</button>
      </div>
    </header>

    <main class="card">
      <div class="filters">
        <div class="small">Showing <span id="count">0</span> payments</div>
      </div>
      <div id="list" class="payments"></div>
      <div id="empty" class="small" style="text-align:center;padding:18px;display:none">No payments found.</div>
    </main>

    <footer>Built for Billan · Manual verification workflow — replace mock with Supabase when ready</footer>
  </div>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document">
      <div class="grid2">
        <div>
          <h3 id="mSchool">School</h3>
          <div style="margin-bottom:12px"><strong id="mAmount">Amount</strong> <span class="small" id="mDate"></span></div>
          <div style="margin-bottom:6px"><strong>Transaction</strong><div class="small" id="mTx"></div></div>
          <div style="margin-bottom:6px"><strong>Payer</strong><div class="small" id="mPayer"></div></div>
          <div style="margin-top:12px"><label class="small">Admin verification notes</label><textarea id="mNotes" class="notes" placeholder="Add notes for audit & record..."></textarea></div>
          <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
            <button id="modalClose" class="btn ghost">Close</button>
            <button id="modalReject" class="btn danger">Reject</button>
            <button id="modalApprove" class="btn success">Approve</button>
          </div>
        </div>
        <div>
          <label class="small">Screenshot</label>
          <img id="mImg" class="screenshot" src="" alt="screenshot"/>
          <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end">
            <button id="downloadBtn" class="btn ghost">Download</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuration placeholders - replace when wiring backend
    const CONFIG = {
      useBackend: false, // toggle to true when backend available
      supabaseUrl: '',
      supabaseAnon: '',
      apiBase: '' // optional API base for edge functions
    };

    // Safe escaping (esc) - escapes quotes too for safe attribute insertion
    function escSafe(s){
      if(s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    // Simple SVG placeholder data URI generator (keeps images reliable)
    function placeholderDataURI(text='No+Image', w=640, h=420){
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'><rect width='100%' height='100%' fill='%230e1b2a'/><text x='50%' y='50%' fill='%2398a6b3' font-family='Verdana,Arial' font-size='20' dominant-baseline='middle' text-anchor='middle'>${text}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // Mock dataset (local-only) - replace with backend fetch
    const MOCK = [
      {id:'pay_001', created_at:new Date().toISOString(), user_id:'user_1', school_id:'sch_001', school_name:'Bright Future School', amount:150000, currency:'RWF', method:'mobile_money', mobile_network:'MTN', mobile_number:'+250788123456', transaction_id:'MM-TRX-001', screenshot_url: null, status:'pending', notes:''},
      {id:'pay_002', created_at:new Date(Date.now()-86400000).toISOString(), user_id:'user_2', school_id:'sch_002', school_name:'St Mary High', amount:200000, currency:'RWF', method:'bank_transfer', mobile_network:'Bank of Kigali', mobile_number:'+250788652314', transaction_id:'BTX-20261012', screenshot_url: null, status:'pending', notes:''}
    ];

    let payments = [...MOCK];
    let filtered = [...payments];
    const list = document.getElementById('list');
    const count = document.getElementById('count');

    function formatAmount(a,c='RWF'){ return new Intl.NumberFormat('en-US').format(a) + ' ' + c; }

    function render(){
      list.innerHTML='';
      if(!filtered.length){ document.getElementById('empty').style.display='block'; count.textContent='0'; return; }
      document.getElementById('empty').style.display='none';
      count.textContent = filtered.length;

      filtered.forEach(p=>{
        const row = document.createElement('div'); row.className='payment-row';

        const left = document.createElement('div'); left.className='p-left';
        const meta = document.createElement('div'); meta.className='p-meta';

        // safe text nodes
        const amountDiv = document.createElement('div'); amountDiv.className='amount'; amountDiv.textContent = formatAmount(p.amount,p.currency);
        const infoDiv = document.createElement('div'); infoDiv.className='muted'; infoDiv.textContent = `${p.method} • ${p.mobile_network} • ${p.transaction_id}`;
        const schoolDiv = document.createElement('div'); schoolDiv.className='muted'; schoolDiv.innerHTML = `School: <strong style='color:#fff'>${escSafe(p.school_name||p.school_id)}</strong>`;
        const payerDiv = document.createElement('div'); payerDiv.className='muted'; payerDiv.textContent = `Payer: ${p.mobile_number || '—'} • ${new Date(p.created_at).toLocaleString()}`;

        meta.appendChild(amountDiv); meta.appendChild(infoDiv); meta.appendChild(schoolDiv); meta.appendChild(payerDiv);
        left.appendChild(meta);

        const right = document.createElement('div');
        const statusSpan = document.createElement('div');
        const statusClass = (p.status==='pending')? 'badge-pending' : (p.status==='approved')? 'badge-approved' : (p.status==='rejected')? 'badge-rejected' : 'badge-pending';
        statusSpan.className = 'badge ' + statusClass; statusSpan.textContent = p.status;

        const actions = document.createElement('div'); actions.className='actions';
        const viewBtn = document.createElement('button'); viewBtn.className='btn ghost'; viewBtn.textContent = 'View';
        viewBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openModal(p.id); });

        const verifyBtn = document.createElement('button'); verifyBtn.className='btn primary'; verifyBtn.textContent = 'Verify';
        verifyBtn.disabled = (p.status !== 'pending');
        verifyBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openModal(p.id); });

        actions.appendChild(viewBtn); actions.appendChild(verifyBtn);

        const containerRight = document.createElement('div'); containerRight.style.display='flex'; containerRight.style.flexDirection='column'; containerRight.style.alignItems='flex-end'; containerRight.style.gap='8px';
        containerRight.appendChild(statusSpan); containerRight.appendChild(actions);

        row.appendChild(left); row.appendChild(containerRight);
        list.appendChild(row);
      });
    }

    function applyFilter(){ const q=document.getElementById('search').value.toLowerCase(); const s=document.getElementById('status').value; filtered = payments.filter(p=>{ if(s && p.status!==s) return false; if(!q) return true; return (p.transaction_id||'').toLowerCase().includes(q) || (p.mobile_number||'').toLowerCase().includes(q) || (p.school_name||'').toLowerCase().includes(q); }); render(); }

    document.getElementById('search').addEventListener('input', applyFilter);
    document.getElementById('status').addEventListener('change', applyFilter);
    document.getElementById('refresh').addEventListener('click', ()=>{ loadPayments(false); }); // user triggered => show toast
    document.getElementById('useBackend').addEventListener('click', ()=>{ CONFIG.useBackend = !CONFIG.useBackend; document.getElementById('useBackend').textContent = CONFIG.useBackend ? 'Backend Enabled' : 'Connect Backend'; showToast('Backend mode: '+CONFIG.useBackend,'info'); });

    async function loadPayments(suppressToast = true){
      if(CONFIG.useBackend){
        try{
          // TODO: replace url with your real endpoint or Supabase query
          const res = await fetch((CONFIG.apiBase||'') + '/api/payments');
          if(!res.ok) throw new Error('Failed to fetch');
          const data = await res.json(); payments = data; filtered = [...payments]; applyFilter(); if(!suppressToast) showToast('Loaded payments from backend','success');
        }catch(e){ if(!suppressToast) showToast('Failed to load from backend, using mock','error'); payments = [...MOCK]; filtered = [...payments]; applyFilter(); }
      } else { payments = [...MOCK]; filtered = [...payments]; applyFilter(); if(!suppressToast) showToast('Loaded mock payments','info'); }
    }

    // Modal logic
    const modal = document.getElementById('modalBackdrop'); const mImg = document.getElementById('mImg'); let current=null;
    function openModal(id){ current = payments.find(x=>x.id===id); if(!current) return; document.getElementById('mSchool').textContent = current.school_name || current.school_id; document.getElementById('mAmount').textContent = formatAmount(current.amount,current.currency); document.getElementById('mDate').textContent = new Date(current.created_at).toLocaleString(); document.getElementById('mTx').textContent = current.transaction_id || '—'; document.getElementById('mPayer').textContent = (current.mobile_number||'—') + ' • ' + (current.mobile_network||''); document.getElementById('mNotes').value = current.notes || '';
      // Load screenshot safely; use placeholder if missing
      mImg.src = current.screenshot_url || placeholderDataURI('No+Image',640,420);
      // Buttons enabled only for pending
      document.getElementById('modalApprove').disabled = (current.status !== 'pending');
      document.getElementById('modalReject').disabled = (current.status !== 'pending');
      modal.style.display = 'flex'; modal.setAttribute('aria-hidden','false');
    }

    document.getElementById('modalClose').addEventListener('click', ()=>{ closeModal(); });
    document.getElementById('downloadBtn').addEventListener('click', ()=>{ if(current && current.screenshot_url) window.open(current.screenshot_url,'_blank'); else showToast('No screenshot available','error'); });

    async function approveCurrent(){ if(!current) return; const notes = document.getElementById('mNotes').value || '';
      if(CONFIG.useBackend){
        try{
          const res = await fetch((CONFIG.apiBase||'') + '/api/payments/'+encodeURIComponent(current.id)+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes})});
          if(!res.ok) throw new Error('Approve failed'); await loadPayments(false);
        }catch(e){ showToast('Approve failed: '+e.message,'error'); }
      } else { current.status = 'approved'; current.notes = notes; applyFilter(); showToast('Payment approved (mock). Entitlement would be created server-side.','success'); }
      closeModal(); }

    async function rejectCurrent(){ if(!current) return; const notes = document.getElementById('mNotes').value || '';
      if(CONFIG.useBackend){
        try{ const res = await fetch((CONFIG.apiBase||'') + '/api/payments/'+encodeURIComponent(current.id)+'/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes})}); if(!res.ok) throw new Error('Reject failed'); await loadPayments(false); }catch(e){ showToast('Reject failed: '+e.message,'error'); }
      } else { current.status = 'rejected'; current.notes = notes; applyFilter(); showToast('Payment rejected (mock).','info'); }
      closeModal(); }

    document.getElementById('modalApprove').addEventListener('click', approveCurrent);
    document.getElementById('modalReject').addEventListener('click', rejectCurrent);

    function closeModal(){ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); current=null; }

    // backdrop click to close
    document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target === document.getElementById('modalBackdrop')) closeModal(); });
    // Esc key
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });

    // Small toast helper
    function showToast(msg,type='info'){ const d=document.createElement('div'); d.textContent=msg; d.style.position='fixed'; d.style.right='18px'; d.style.bottom='18px'; d.style.background = type==='success'? '#14532d' : type==='error'? '#7f1d1d' : '#1e3a5f'; d.style.color='#fff'; d.style.padding='10px 14px'; d.style.borderRadius='8px'; d.style.zIndex=9999; document.body.appendChild(d); setTimeout(()=>{ d.style.opacity='0'; setTimeout(()=>d.remove(),300); },3200); }

    // Initial load (suppress initial toast)
    loadPayments(true);
    render();
  </script>
</body>
</html>
