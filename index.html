<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payments Verification UI — Billan (Mock)</title>
  <style>
    :root{--bg:#0b1120;--card:#111827;--muted:#94a3b8;--accent:#d4a843;--success:#22c55e;--danger:#ef4444}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#e6eef6}
    .wrap{max-width:1100px;margin:32px auto;padding:20px}
    .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .title{font-size:20px;font-weight:700}
    .card{background:var(--card);border-radius:10px;padding:16px;border:1px solid #192229}
    .controls{display:flex;gap:8px;align-items:center}
    .search{padding:8px 12px;border-radius:8px;border:1px solid #1f2b33;background:#0f1720;color:var(--muted)}
    .select{padding:8px 12px;border-radius:8px;border:1px solid #1f2b33;background:#0f1720;color:var(--muted)}
    .payments-list{margin-top:12px}
    .req-row{border-bottom:1px solid rgba(255,255,255,.04);padding:12px 0}
    .req-main{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
    .meta{display:flex;gap:12px;align-items:center}
    .amount{font-weight:800;font-size:16px}
    .sub{color:var(--muted);font-size:13px}
    .badge{padding:6px 10px;border-radius:999px;font-weight:700}
    .badge.pending{background:rgba(245,158,11,.12);color:var(--accent)}
    .badge.approved{background:rgba(34,197,94,.12);color:var(--success)}
    .badge.rejected{background:rgba(239,68,68,.12);color:var(--danger)}
    .detail{display:none;padding-top:12px}
    .detail.open{display:block}
    .screenshot{max-width:420px;border-radius:8px;border:1px solid #17202a;display:block;margin-top:8px}
    .actions{margin-top:10px;display:flex;gap:8px}
    .btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
    .btn.primary{background:var(--accent);color:#06121a}
    .btn.ghost{background:transparent;border:1px solid #1f2b33;color:var(--muted)}
    .btn.success{background:var(--success);color:#052014}
    .btn.danger{background:var(--danger);color:#fff}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
    .modal{background:var(--card);width:720px;border-radius:10px;padding:16px;border:1px solid #182229}
    .textarea{width:100%;min-height:90px;padding:10px;border-radius:8px;border:1px solid #1f2b33;background:#0f1720;color:var(--muted)}
    .footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
    .empty{padding:36px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div class="title">Payments — Manual Verification (Mock)</div>
      <div class="controls">
        <input id="q" class="search" placeholder="Search by TX, phone, school...">
        <select id="statusFilter" class="select">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <button id="refreshBtn" class="btn ghost">Refresh</button>
      </div>
    </div>

    <div class="card">
      <div id="paymentsList" class="payments-list"></div>
      <div id="empty" class="empty" style="display:none">No payments found.</div>
    </div>
  </div>

  <div id="modal" class="modal-bg">
    <div class="modal">
      <h3 id="modalTitle">Verify Payment</h3>
      <div style="display:flex;gap:14px;align-items:flex-start">
        <div style="flex:1">
          <div style="margin-bottom:8px"><strong id="mSchool">School</strong></div>
          <div style="margin-bottom:6px"><strong>Amount:</strong> <span id="mAmount"></span></div>
          <div style="margin-bottom:6px"><strong>TX:</strong> <span id="mTx"></span></div>
          <div style="margin-bottom:6px"><strong>Payer:</strong> <span id="mPayer"></span></div>
          <div style="margin-top:10px"><label>Admin notes</label><textarea id="mNotes" class="textarea" placeholder="Add notes..."></textarea></div>
        </div>
        <div style="width:360px">
          <label>Screenshot</label>
          <img id="mImg" src="" class="screenshot" alt="screenshot">
        </div>
      </div>
      <div class="footer">
        <button class="btn ghost" id="modalClose">Close</button>
        <button class="btn danger" id="rejectBtn">Reject</button>
        <button class="btn success" id="approveBtn">Approve</button>
      </div>
    </div>
  </div>

  <script>
    // Mock data
    const MOCK = [
      { id:'pay_001', created_at:new Date().toISOString(), user_id:'user_1', school_id:'sch_001', school_name:'Bright Future School', amount:150000, currency:'RWF', method:'mobile_money', mobile_network:'MTN', mobile_number:'250788123456', transaction_id:'MM-TRX-001', screenshot_url:'https://via.placeholder.com/420x300.png?text=Screenshot+1', status:'pending', notes:'' },
      { id:'pay_002', created_at:new Date(Date.now()-1000*60*60*24).toISOString(), user_id:'user_2', school_id:'sch_002', school_name:'St Mary High', amount:200000, currency:'RWF', method:'bank_transfer', mobile_network:'Bank of Kigali', mobile_number:'250788652314', transaction_id:'BTX-20261012', screenshot_url:'https://via.placeholder.com/420x300.png?text=Screenshot+2', status:'pending', notes:'' }
    ];

    let payments = [...MOCK];
    let filtered = [...payments];
    const listEl = document.getElementById('paymentsList');
    const emptyEl = document.getElementById('empty');

    function render(){
      listEl.innerHTML = '';
      if(!filtered.length){ emptyEl.style.display='block'; return; } else emptyEl.style.display='none';
      filtered.forEach(p=>{
        const row = document.createElement('div'); row.className='req-row';
        const main = document.createElement('div'); main.className='req-main';
        const left = document.createElement('div'); left.className='meta';
        left.innerHTML = `<div><div class='amount'>${formatAmount(p.amount,p.currency)}</div><div class='sub'>${p.method} • ${p.mobile_network} • ${p.transaction_id}</div></div><div style="min-width:200px;margin-left:8px"><div class='sub'>School: <strong>${escape(p.school_name)}</strong></div><div class='sub'>Payer: ${escape(p.mobile_number)} • ${new Date(p.created_at).toLocaleString()}</div></div>`;
        const right = document.createElement('div'); right.innerHTML = `<div class='badge ${p.status}'>${p.status}</div>`;
        main.appendChild(left); main.appendChild(right);
        main.onclick = ()=>{ toggleDetail(p.id); };

        const detail = document.createElement('div'); detail.className='detail'; detail.id='d-'+p.id;
        detail.innerHTML = `<div><img src='${p.screenshot_url}' class='screenshot' alt='screenshot'></div><div class='actions'><button class='btn primary' onclick="openModal('${p.id}',event)">Open Verify</button><button class='btn ghost' onclick="download('${p.screenshot_url}')">Download</button></div>`;

        row.appendChild(main); row.appendChild(detail); listEl.appendChild(row);
      });
    }

    function toggleDetail(id){ const d=document.getElementById('d-'+id); if(d) d.classList.toggle('open'); }
    function formatAmount(a,c){ return new Intl.NumberFormat('en-US').format(a)+' '+(c||'RWF'); }
    function escape(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    document.getElementById('q').addEventListener('input', ()=>{ applyFilter(); });
    document.getElementById('statusFilter').addEventListener('change', ()=>{ applyFilter(); });
    document.getElementById('refreshBtn').addEventListener('click', ()=>{ loadPayments(); });

    function applyFilter(){ const q=document.getElementById('q').value.toLowerCase(); const s=document.getElementById('statusFilter').value; filtered = payments.filter(p=>{ if(s && p.status!==s) return false; if(!q) return true; return (p.transaction_id||'').toLowerCase().includes(q) || (p.mobile_number||'').toLowerCase().includes(q) || (p.school_name||'').toLowerCase().includes(q) }); render(); }

    function loadPayments(){ // placeholder for real backend fetch
      // TODO: replace with fetch('/api/payments') when backend exists
      payments = [...MOCK]; filtered = [...payments]; applyFilter(); showToast('Payments refreshed (mock)', 'info'); }

    // Modal
    const modalBg = document.getElementById('modal');
    const mTitle = document.getElementById('modalTitle');
    const mSchool = document.getElementById('mSchool');
    const mAmount = document.getElementById('mAmount');
    const mTx = document.getElementById('mTx');
    const mPayer = document.getElementById('mPayer');
    const mImg = document.getElementById('mImg');
    const mNotes = document.getElementById('mNotes');
    let current = null;

    function openModal(id, evt){ if(evt) evt.stopPropagation(); const p=payments.find(x=>x.id===id); if(!p) return; current=p; mSchool.textContent=p.school_name; mAmount.textContent=formatAmount(p.amount,p.currency); mTx.textContent=p.transaction_id; mPayer.textContent=p.mobile_number+' • '+p.mobile_network; mImg.src=p.screenshot_url; mNotes.value=p.notes||''; modalBg.style.display='flex'; }
    document.getElementById('modalClose').addEventListener('click', ()=>{ modalBg.style.display='none'; });

    document.getElementById('approveBtn').addEventListener('click', ()=>{ if(!current) return; current.status='approved'; current.notes=mNotes.value||''; render(); modalBg.style.display='none'; showToast('Payment approved (mock). Entitlement would be granted server-side.', 'success'); });
    document.getElementById('rejectBtn').addEventListener('click', ()=>{ if(!current) return; current.status='rejected'; current.notes=mNotes.value||''; render(); modalBg.style.display='none'; showToast('Payment rejected (mock).'); });

    function download(url){ if(!url) return showToast('No screenshot', 'error'); window.open(url,'_blank'); }

    // toast
    function showToast(msg,type='info'){ const d=document.createElement('div'); d.textContent=msg; d.style.position='fixed'; d.style.right='18px'; d.style.bottom='18px'; d.style.background= type==='success'? '#14532d': type==='error'? '#7f1d1d':'#1e3a5f'; d.style.color='#fff'; d.style.padding='10px 14px'; d.style.borderRadius='8px'; document.body.appendChild(d); setTimeout(()=>d.remove(),3500); }

    // initial
    loadPayments(); render();

  </script>
</body>
</html>
